<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tic-Tac-Toe</h1>
  
  <div class="players">
    <input type="text" id="player1Name" placeholder="Player 1 (X)">
    <input type="text" id="player2Name" placeholder="Player 2 (O)">
    <button id="confirmBtn">Confirm Names</button>
  </div>

  <p id="status">Enter names and confirm to start</p>

  <button id="resetBtn" style="display:none;">Reset Game</button>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
